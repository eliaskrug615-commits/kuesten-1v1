<script>
  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('start-btn') ||
      Array.from(document.querySelectorAll('button')).find(b => /match starten/i.test(b.textContent || ''));
    if (btn && typeof window.startMatch === 'function') {
      const triggerStart = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startScreen = document.getElementById('start-screen');
        const portraitWarn = document.getElementById('portrait-warning');
        if (portraitWarn) portraitWarn.style.display = 'none';
        if (startScreen) startScreen.style.display = 'none';
        try { window.startMatch(); } catch (_) {}
      };
      btn.addEventListener('pointerup', triggerStart, { passive: false });
      btn.addEventListener('touchend', triggerStart, { passive: false });
    }
  });
</script>
