name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Lizenzen schreiben
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Capacitor installieren & Android-Projekt initialisieren
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "1v1 Kuesten Arena" "com.deinname.kuesten1v1" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Debug-APK bauen
        run: |
          cd android
          ./gradlew assembleDebug

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kuesten-1v1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
